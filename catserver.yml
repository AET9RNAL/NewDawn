    craftRequestThrottle: 100
    itemNBTThrottle: 400
    fastClickGUI: false
    clickGUIThrottle: 600
  fml:
    disableHandshake: false
    disableStatusModInfo: false
disableUpdateGameProfile: false
disableAsyncCatchWarn: false
versionCheck: true
