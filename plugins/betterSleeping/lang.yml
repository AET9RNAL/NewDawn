# ################ #
#  BetterSleeping  #
# ################ #

prefix: "&6[Sleep] &3"

# Message players receive when enough people are sleeping
enough_sleeping: "Enough players are sleeping now, the night/storm will be skipped instantly!"

# Message players receive after the night/storm has been skipped
good_morning: "Good morning! Have a nice day!"

# Players receive this message if night skipping is canceled because someone left their bed
cancelled: "Someone left their bed! Waiting for <amount> players to sleep."

# When someone enters a bed
amount_left: "<amount> players needed to skip the night/storm!"

# Message sent to a player who tries to use a command without permission
no_permission: "&4You do not have permission to use this command!"

# Message sent to the command sender and console after reload is complete
message_reloaded: "Reload complete!"

# Players who try to spam BetterSleeping messages will receive this
sleep_spam: "Wait <time> seconds before you can sleep again!"
